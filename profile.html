<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Profile | Mishra Classes</title>


<link rel="icon" href="../images/logo.png">



<!-- CSS -->

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/dashboard.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">

<!-- Vercel Speed Insights -->
<script type="module" src="../js/speed-insights.js"></script>

</head>




<body class="dashboard-page">



<!-- BACKGROUND -->

<div class="bg-logo"></div>







<!-- SIDEBAR -->


<aside class="sidebar glass">



<div class="sidebar-logo">


<img src="../images/logo.png" alt="Mishra Classes">


<h2>
Mishra Classes
</h2>


</div>






<ul>


<li>

<a href="dashboard.html">
🏠 Dashboard
</a>

</li>



<li>

<a href="profile.html" class="active">
👤 Profile
</a>

</li>




<li>

<a href="settings.html">
⚙ Settings
</a>

</li>




<li>

<a href="index.html">
🌐 Website
</a>

</li>



</ul>






<button id="logoutBtn" class="logout-btn">

Logout

</button>




</aside>









<!-- MAIN CONTENT -->


<main class="dashboard-content">





<header class="dashboard-header">


<div>

<h1>
My Profile 👤
</h1>


<p>
Manage your account information.
</p>


</div>


</header>









<!-- PROFILE CARD -->


<section class="profile-section">





<div class="profile-card glass">





<div class="profile-image">


<img src="../images/profile.jpeg" alt="Student Profile" id="profileImage">


</div>







<h2 id="profileName">
Student Name
</h2>


<p id="profileEmail">
email@example.com
</p>





</div>









<!-- PROFILE FORM -->


<div class="profile-form glass">



<h2>
Personal Information
</h2>





<form id="profileForm">





<div class="input-group">


<label>
Full Name
</label>


<input 
type="text"
id="profileNameInput"
placeholder="Enter your name">


</div>







<div class="input-group">


<label>
Email
</label>


<input 
type="email"
id="profileEmailInput"
disabled>


</div>








<div class="input-group">


<label>
Class
</label>



<select id="profileClass">


<option value="">
Select Class
</option>


<option value="9">
Class 9th
</option>


<option value="10">
Class 10th
</option>


<option value="11">
Class 11th
</option>


<option value="12">
Class 12th
</option>


</select>



</div>








<div class="input-group">


<label>
Phone Number
</label>


<input 
type="tel"
id="profilePhone"
placeholder="Enter phone number">


</div>








<button 
type="submit"
class="btn-primary">

Save Changes

</button>





</form>




</div>






</section>









<!-- ACCOUNT INFO -->


<section class="account-info glass">


<h2>
Account Details
</h2>



<div class="info-row">

<span>
Account Status
</span>


<strong>
Active
</strong>


</div>





<div class="info-row">

<span>
Role
</span>


<strong id="userRole">
Student
</strong>


</div>





<div class="info-row">

<span>
Member Since
</span>


<strong id="joinDate">
-
</strong>


</div>




</section>







</main>









<!-- JAVASCRIPT -->


<script type="module" src="../js/profile.js"></script>


</body>


</html>
