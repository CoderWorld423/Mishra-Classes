<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Mishra Classes</title>

<meta name="description" content="Login to Mishra Classes student portal.">

<link rel="icon" type="image/png" href="../images/logo.png">


<!-- CSS -->

<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">

<!-- Vercel Web Analytics -->
<script defer src="/_vercel/insights/script.js"></script>

</head>



<body class="auth-page">



<!-- Background Logo -->

<div class="bg-logo"></div>





<!-- LOGIN CONTAINER -->


<section class="auth-section">



<div class="auth-card glass">


<!-- LOGO -->

<div class="auth-logo">

<img src="../images/logo.png" alt="Mishra Classes">

<h2>
Mishra Classes
</h2>

</div>





<h1>
Welcome Back
</h1>


<p>
Login to continue your learning journey.
</p>





<!-- LOGIN FORM -->


<form id="loginForm">
<div class="input-group">

<label>
Email
</label>


<input type="email"id="loginEmail"placeholder="Enter your email"autocomplete="username"required>

<div id="loginMessage" class="message"></div>

<div class="input-group">


<label>
Password
</label>


<input 
type="password"
id="loginPassword"
placeholder="Enter your password"
autocomplete="current-password"
required>


</div>







<div class="forgot">

<a href="#">
Forgot Password?
</a>

</div>








<button 
type="submit"
class="btn-primary">

Login

</button>






</form>







<!-- GOOGLE LOGIN -->


<div class="divider">

<span>
OR
</span>

</div>







<button 
type="button"
id="googleLogin"
class="google-btn">



<img 
src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
alt="Google Logo">


Continue with Google


</button>








<p class="auth-footer">

Don't have an account?

<a href="signup.html">
Create Account
</a>


</p>




</div>



</section>





<!-- JAVASCRIPT -->


<script type="module" src="../js/auth.js"></script>

<script src="../js/script.js"></script>



</body>

</html>
